name: Node.js CI

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:4.4
        ports:
          - 27017:27017
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: mysecretpassword
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    strategy:
      matrix:
        node-version: [22.x]

    steps:
    - uses: actions/checkout@v6

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v6
      with:
        node-version: ${{ matrix.node-version }}

    - name: Install Dependencies
      run: npm ci

    - name: Seed Database
      env:
        SQL_LOCAL_CONN_URL: localhost
        SQL_USERNAME: root
        SQL_PASSWORD: mysecretpassword
        MONGO_LOCAL_CONN_URL: mongodb://localhost:27017/node-dvws
      run: node scripts/seed-database.js

    - name: Start Server and Run Tests
      env:
        EXPRESS_JS_PORT: 3000
        SQL_LOCAL_CONN_URL: localhost
        SQL_USERNAME: root
        SQL_PASSWORD: mysecretpassword
        MONGO_LOCAL_CONN_URL: mongodb://localhost:27017/node-dvws
        JWT_SECRET: access
      run: |
        # Start server in background
        node src/server.js > app.log 2>&1 &
        PID=$!
        echo "Server started with PID $PID"
        
        # Wait for the generated API spec before running tests
        curl --fail --silent --show-error --retry 12 --retry-connrefused --retry-delay 5 --max-time 10 --output /dev/null http://127.0.0.1:3000/openAPI-spec.json
        
        # Debug connectivity
        echo "Testing connectivity with curl..."
        curl -v http://127.0.0.1:3000/openAPI-spec.json
        curl -v http://127.0.0.1:3000/api/v2/info || echo "API Info failed"
        
        # Run tests (allow failure so we can print logs)
        set +e
        npm run test:vulnerabilities
        EXIT_CODE=$?
        set -e
        
        # Kill server
        kill $PID
        
        # Display logs
        echo "=== Application Logs ==="
        cat app.log
        echo "========================"
        
        exit $EXIT_CODE
